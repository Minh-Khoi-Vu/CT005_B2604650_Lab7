<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0ebf8">
  <title>việc nhẹ lương cao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --page: #f0ebf8;
      --ink: #202124;
      --muted: #5f6368;
      --accent: #673ab7;
      --line: #dadce0;
      --card-width: 640px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 14px/1.5 Roboto, Arial, sans-serif;
    }

    .form-shell {
      width: min(var(--card-width), calc(100% - 32px));
      margin: 28px auto 48px;
    }

    .form-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 24px;
    }

    .form-heading {
      border-top: 10px solid var(--accent);
      padding-top: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.25;
      font-weight: 400;
    }

    .description { margin: 0; color: var(--ink); }
    .required-note { margin: 18px 0 0; color: #d93025; font-size: 12px; }
    .question-title { display: block; margin: 0 0 16px; font-size: 16px; font-weight: 500; }
    .required { color: #d93025; }

    .text-input {
      width: min(100%, 340px);
      border: 0;
      border-bottom: 1px solid #80868b;
      border-radius: 0;
      outline: 0;
      padding: 8px 0 7px;
      color: var(--ink);
      background: transparent;
      font: inherit;
      transition: border-color .15s, border-width .15s;
    }

    .text-input::placeholder { color: #70757a; opacity: 1; }
    .text-input:focus { border-bottom: 2px solid var(--accent); }
    textarea.text-input { min-height: 40px; resize: vertical; }

    .choice-list { display: grid; gap: 14px; }
    .choice {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 24px;
      cursor: pointer;
    }

    .choice input {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin: 0;
      accent-color: var(--accent);
    }

    .actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
    button { font: inherit; cursor: pointer; }
    .submit {
      min-height: 40px;
      padding: 0 24px;
      border: 0;
      border-radius: 4px;
      background: var(--accent);
      color: white;
      font-weight: 500;
      box-shadow: 0 1px 2px #0002;
    }

    .submit:hover { background: #5e35a1; }
    .clear {
      border: 0;
      padding: 10px 4px;
      color: var(--accent);
      background: transparent;
      font-weight: 500;
    }

    .clear:hover { text-decoration: underline; }
    .form-footer { padding: 18px 0; color: #70757a; text-align: center; font-size: 12px; }
    .form-footer strong { display: block; margin-bottom: 4px; font-size: 22px; font-weight: 500; letter-spacing: 1px; }
    .status { margin: 14px 0 0; color: #137333; }
    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      .form-shell { width: calc(100% - 24px); margin-top: 12px; }
      .form-card { padding: 20px 18px; }
      .form-heading { padding-top: 16px; }
      h1 { font-size: 26px; }
      .actions { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="form-shell">
    <form id="survey-form">
      <header class="form-card form-heading">
        <h1>việc nhẹ lương cao</h1>
        <p class="description">Cảm ơn bạn đã dành thời gian trả lời biểu mẫu này.</p>
        <p class="required-note">* Biểu thị câu hỏi bắt buộc</p>
      </header>

      <section class="form-card">
        <label class="question-title" for="full-name">Họ và tên <span class="required">*</span></label>
        <input class="text-input" id="full-name" name="full-name" type="text" placeholder="Câu trả lời của bạn" autocomplete="name" required>
      </section>

      <section class="form-card">
        <label class="question-title" for="class-name">Lớp / đơn vị <span class="required">*</span></label>
        <input class="text-input" id="class-name" name="class-name" type="text" placeholder="Câu trả lời của bạn" required>
      </section>

      <section class="form-card">
        <label class="question-title" for="email">Địa chỉ email <span class="required">*</span></label>
        <input class="text-input" id="email" name="email" type="email" placeholder="Câu trả lời của bạn" autocomplete="email" required>
      </section>

      <fieldset class="form-card" style="border:1px solid var(--line);">
        <legend class="question-title">Bạn đánh giá trải nghiệm của mình thế nào? <span class="required">*</span></legend>
        <div class="choice-list">
          <label class="choice"><input type="radio" name="rating" value="Rất tốt" required> Rất tốt</label>
          <label class="choice"><input type="radio" name="rating" value="Tốt"> Tốt</label>
          <label class="choice"><input type="radio" name="rating" value="Bình thường"> Bình thường</label>
          <label class="choice"><input type="radio" name="rating" value="Cần cải thiện"> Cần cải thiện</label>
        </div>
      </fieldset>

      <fieldset class="form-card" style="border:1px solid var(--line);">
        <legend class="question-title">Bạn quan tâm đến những nội dung nào?</legend>
        <div class="choice-list">
          <label class="choice"><input type="checkbox" name="topics" value="Học tập"> Học tập</label>
          <label class="choice"><input type="checkbox" name="topics" value="Công nghệ"> Công nghệ</label>
          <label class="choice"><input type="checkbox" name="topics" value="Hoạt động"> Hoạt động</label>
          <label class="choice"><input type="checkbox" name="topics" value="Khác"> Khác</label>
        </div>
      </fieldset>

      <section class="form-card">
        <label class="question-title" for="feedback">Ý kiến hoặc góp ý khác</label>
        <textarea class="text-input" id="feedback" name="feedback" placeholder="Câu trả lời của bạn"></textarea>
      </section>

      <div class="actions">
        <button class="submit" type="submit">Gửi</button>
        <button class="clear" type="reset">Xóa hết câu trả lời</button>
      </div>
      <p class="status" id="submit-status" role="status" hidden>Câu trả lời của bạn đã được ghi nhận.</p>
    </form>
    <footer class="form-footer"><strong>Google Biểu mẫu</strong>Biểu mẫu này được tạo bằng HTML.</footer>
  </main>
  <script>
    const surveyForm = document.querySelector('#survey-form');
    const submitStatus = document.querySelector('#submit-status');

    surveyForm.addEventListener('submit', (event) => {
      event.preventDefault();
      submitStatus.hidden = false;
      submitStatus.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    surveyForm.addEventListener('reset', () => {
      submitStatus.hidden = true;
    });
  </script>
</body>
</html>
